name: Deploy ROOT AI to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Deploy production
        run: npx vercel@50.9.0 --prod --yes --token="${{ secrets.VERCEL_TOKEN }}" --scope="7to1rootai"
